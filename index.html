<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <meta name="color-scheme" content="dark">
  <title>Tabela Periódica Interativa</title>
  <meta name="description" content="Tabela periódica interativa com efeito glassmorphism, zoom cinematográfico e informações sobre cada elemento.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="orbs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="3.2"/><ellipse cx="20" cy="20" rx="16" ry="6"/><ellipse cx="20" cy="20" rx="16" ry="6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="16" ry="6" transform="rotate(-60 20 20)"/></svg>
        </div>
        <div>
          <h1>Tabela Periódica</h1>
          <p>118 elementos · clique para explorar</p>
        </div>
      </div>

      <button class="random lab-btn glass-inset" id="lab-open" type="button" aria-label="Abrir o laboratório" title="Laboratório (L)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6.2L4.6 18.3A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.7L14 9.2V3"/><path d="M7.5 14h9"/></svg>
        <span>Laboratório</span><em>novo</em>
      </button>

      <button class="random glass-inset" id="random" type="button" aria-label="Elemento aleatório" title="Elemento aleatório (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        <span>Surpreenda-me</span>
      </button>

      <label class="search glass-inset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar: nome, símbolo ou número" autocomplete="off" aria-label="Buscar elemento">
        <kbd>/</kbd>
      </label>

      <nav class="modes glass-inset" id="modes" aria-label="Modo de visualização">
        <button data-mode="categoria" class="active">Categoria</button>
        <button data-mode="estado">Estado físico</button>
        <button data-mode="eletronegatividade">Eletronegatividade</button>
        <button data-mode="raio">Raio atômico</button>
        <button data-mode="descoberta">Descoberta</button>
        <span class="mode-pill" aria-hidden="true"></span>
      </nav>
    </header>

    <div class="control glass" id="control" hidden>
      <span class="control-label" id="control-label"></span>
      <input type="range" id="control-range">
      <output id="control-value"></output>
    </div>

    <main id="stage">
      <div id="pan" class="pan">
        <div id="table" class="table" role="grid" aria-label="Tabela periódica"></div>
      </div>
      <div class="zoomctl glass" id="zoomctl" aria-label="Zoom da tabela">
        <button type="button" data-z="in" aria-label="Ampliar">+</button>
        <button type="button" data-z="out" aria-label="Reduzir">−</button>
        <button type="button" data-z="fit" aria-label="Ajustar à tela"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </main>

    <button class="daily glass" id="daily" type="button" aria-label="Abrir o elemento do dia"></button>

    <footer class="legend" id="legend" aria-label="Legenda"></footer>
    <p class="m-hint" id="m-hint">Pince para ampliar · toque num elemento</p>
  </div>

  <!-- Vista de detalhe (zoom cinematográfico) -->
  <section id="detail" aria-hidden="true" aria-modal="true" role="dialog" aria-labelledby="d-name">
    <div class="d-backdrop"></div>
    <div class="d-flash"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>

    <div class="d-layout">
      <div class="d-hero-area">
        <canvas id="atom"></canvas>
        <div class="d-hero-slot" id="hero-slot"></div>
        <div class="d-hud" id="hud"></div>
        <div class="d-hint">← → navegar · Esc fechar</div>
      </div>
      <div class="d-panels" id="panels"></div>
    </div>

    <button class="d-btn d-close glass" id="d-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="d-btn d-share glass" id="d-share" aria-label="Copiar link deste elemento">
      <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
    </button>
    <button class="d-btn d-prev glass" id="d-prev" aria-label="Elemento anterior">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="d-btn d-next glass" id="d-next" aria-label="Próximo elemento">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>

  <section id="lab" aria-hidden="true" role="dialog" aria-label="Laboratório"></section>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

  <script src="./js/dados.js"></script>
  <script src="./js/descricoes.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
